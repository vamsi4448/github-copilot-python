<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <h1>Sudoku Game</h1>
  <div class="theme-toggle-container">
    <button id="theme-toggle" aria-label="Toggle dark and light mode">Switch to Dark Mode</button>
  </div>
  <div id="sudoku-board"></div>
  <div id="timer" class="timer" aria-live="polite">Time: <span id="elapsed-time">00:00</span></div>
  <div class="controls">
    <label for="difficulty">Difficulty:</label>
    <select id="difficulty" aria-label="Choose difficulty level">
      <option value="easy">Easy</option>
      <option value="medium" selected>Medium</option>
      <option value="hard">Hard</option>
    </select>
    <button id="new-game">New Game</button>
    <button id="hint-button">Hint</button>
    <button id="check-solution">Check Solution</button>
    <span id="hint-display">Hints used: <strong id="hint-count">0</strong></span>
    <span id="message"></span>
  </div>
  <section class="scoreboard-container" aria-label="Top 10 scoreboard">
    <h2>Top 10 Fastest Times</h2>
    <table id="scoreboard-table">
      <thead>
        <tr>
          <th>Rank</th>
          <th>Name</th>
          <th>Time</th>
          <th>Difficulty</th>
          <th>Hints</th>
        </tr>
      </thead>
      <tbody id="scoreboard-body"></tbody>
    </table>
    <p id="scoreboard-empty">No completed games yet.</p>
  </section>
  <!-- Name entry modal shown when a player completes a puzzle -->
  <div id="name-modal" class="modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-content">
      <h3>Congratulations!</h3>
      <p>Please enter your name for the Top 10 scoreboard:</p>
      <input id="player-name-input" type="text" maxlength="50" placeholder="Your name" aria-label="Player name">
      <div class="modal-actions">
        <button id="player-name-save">Save</button>
        <button id="player-name-cancel">Cancel</button>
      </div>
    </div>
  </div>
  <script src="/static/main.js"></script>
</body>
</html>
